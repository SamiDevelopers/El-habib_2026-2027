function renderStudentGrades(student) {
    const assignments = AppData.assignments.filter(a => a.studentId === student.id);
    const bySubject = {};
    Helpers.getSubjects().forEach(sub => {
        bySubject[sub.value] = {
            subject: sub,
            all: assignments.filter(a => a.subject === sub.value),
            evaluated: assignments.filter(a => a.subject === sub.value && a.status === 'evaluated')
        };
    });
    const totalEvaluated = assignments.filter(a => a.status === 'evaluated').length;
    const totalScore = assignments.filter(a => a.status === 'evaluated' && a.score !== null).reduce((s, a) => s + a.score, 0);
    const avg = totalEvaluated > 0 ? (totalScore / totalEvaluated).toFixed(1) : 0;

    return `
        <div class="stats-grid">
            <div class="stat-card"><div class="icon">📝</div><div class="num">${assignments.length}</div><div class="lbl">إجمالي الواجبات</div></div>
            <div class="stat-card"><div class="icon">✅</div><div class="num">${totalEvaluated}</div><div class="lbl">تم التقييم</div></div>
            <div class="stat-card"><div class="icon">📊</div><div class="num">${totalScore}</div><div class="lbl">المجموع</div></div>
            <div class="stat-card"><div class="icon">⭐</div><div class="num">${avg}</div><div class="lbl">المتوسط</div></div>
        </div>
        <div class="grid-2">
            ${Object.values(bySubject).map(item => {
                const subjectScore = item.evaluated.reduce((s, a) => s + (a.score || 0), 0);
                const subjectAvg = item.evaluated.length > 0 ? (subjectScore / item.evaluated.length).toFixed(1) : '—';
                return `
                    <div class="card">
                        <div class="card-title"><span class="icon">${item.subject.icon}</span> ${item.subject.label}</div>
                        <div class="gold-line"></div>
                        <p>الواجبات: ${item.all.length} • تم التقييم: ${item.evaluated.length} • المتوسط: <strong>${subjectAvg}</strong></p>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function renderStudentAttendance(student) {
    const totalWeeks = AppData.settings.totalWeeks || 15;
    const attendance = AppData.attendance.filter(a => a.studentId === student.id && a.type !== 'visitation');
    const present = attendance.filter(a => a.status === 'present').length;
    const absent = attendance.filter(a => a.status === 'absent').length;
    const pct = Helpers.percentage(present, totalWeeks);
    const status = Helpers.attendanceStatus(pct);

    const weeks = [];
    for (let i = 1; i <= totalWeeks; i++) {
        const record = attendance.find(a => a.week === i);
        const wDate = Helpers.getWeekDateShort(i);
        let icon = '⏳';
        if (record) icon = record.status === 'present' ? '✅' : '❌';
        weeks.push(`<tr><td>الأسبوع ${i}</td><td>${wDate}</td><td>${icon}</td></tr>`);
    }

    return `
        <div class="stats-grid">
            <div class="stat-card"><div class="icon">📅</div><div class="num">${totalWeeks}</div><div class="lbl">إجمالي الأسابيع</div></div>
            <div class="stat-card"><div class="icon">✅</div><div class="num">${present}</div><div class="lbl">حضور</div></div>
            <div class="stat-card"><div class="icon">❌</div><div class="num">${absent}</div><div class="lbl">غياب</div></div>
            <div class="stat-card"><div class="icon">📊</div><div class="num">${pct}%</div><div class="lbl">النسبة</div></div>
        </div>
        <div class="card mt-2">
            <div class="card-title"><span class="icon">📅</span> سجل الحضور</div>
            <div class="gold-line"></div>
            <div class="table-wrap">
                <table><thead><tr><th>الأسبوع</th><th>التاريخ</th><th>الحالة</th></tr></thead>
                <tbody>${weeks.join('')}</tbody></table>
            </div>
        </div>
    `;
}

function renderStudentAssignments(student) {
    const assignments = AppData.assignments.filter(a => a.studentId === student.id);
    const allowed = Helpers.isSubmissionAllowed();

    return `
        <div class="flex-between mb-2">
            <h3>📝 واجباتي</h3>
            <button class="btn btn-gold btn-sm" onclick="openAddAssignmentModal('${student.id}')" ${!allowed ? 'disabled' : ''}>
                + إضافة واجب
            </button>
        </div>
        ${!allowed ? '<div class="error-msg" style="display:block;">⚠️ الإرسال متاح من الجمعة إلى الثلاثاء فقط</div>' : ''}
        ${assignments.length === 0 ? '<div class="empty-state"><span class="icon">📭</span>لا توجد واجبات</div>' : `
            <div class="grid-2">
                ${assignments.map(a => `
                    <div class="card">
                        <div class="flex-between mb-1">
                            <strong>${Helpers.getSubjectLabel(a.subject)}</strong>
                            ${a.status === 'evaluated' ? Helpers.badge('تم التقييم', 'success') :
                              a.status === 'pending' ? Helpers.badge('قيد الانتظار', 'warning') :
                              Helpers.badge('لم يتم', 'danger')}
                        </div>
                        <p style="font-size:0.9rem;">${Helpers.escapeHtml(a.content) || '—'}</p>
                        ${a.fileUrl ? `<a href="${a.fileUrl}" target="_blank" class="btn btn-outline btn-sm mt-1">📎 عرض</a>` : ''}
                        ${a.score !== null ? `<p class="mt-1"><strong>الدرجة:</strong> ${a.score}/10</p>` : ''}
                        ${a.notes ? `<p><strong>ملاحظات:</strong> ${a.notes}</p>` : ''}
                    </div>
                `).join('')}
            </div>

}

// ---------- Servant Dashboard (نظام الأدوار الجديد) ----------
function renderServantDashboard() {
    const user = State.currentUser;
    if (!user || user.type !== 'servant') return '';

    const servant = user.data;
    const subjects = Helpers.getServantSubjects(servant);
    const adminRoles = Helpers.getServantAdminRoles(servant);
    const isSuperAdmin = Helpers.isSuperAdmin(servant);
    const isMainControl = Helpers.isMainControl(servant);
    const isAdminControl = Helpers.isAdminControl(servant);
    const isClassSupervisor = Helpers.isClassSupervisor(servant);
    const isSubjectTeacher = Helpers.isSubjectTeacher(servant);

    // تحديد الفصول المتاحة
    let students;
    if (isSuperAdmin || isMainControl || isAdminControl || servant.classGroup === 'الكل') {
        students = AppData.students;
    } else {
        students = AppData.students.filter(s => s.classGroup === servant.classGroup);
    }

    // بناء التبويبات
    const availableTabs = [];

    // الحضور
    if (Helpers.canEditAttendance(servant)) {
        availableTabs.push({ key: 'attendance', label: 'تسجيل الحضور', icon: '📋' });
    }

    // مواد التخصص (لو مدرس)
    if (isSubjectTeacher) {
        subjects.forEach(subjectValue => {
            const subject = Helpers.getSubjects().find(s => s.value === subjectValue);
            if (subject) {
                availableTabs.push({
                    key: `subject_${subjectValue}`,
                    label: `تقييم ${subject.label}`,
                    icon: subject.icon
                });
            }
        });
    }

    // نظرة عامة على الدرجات (لمسؤول الفصل / الكنترول)
    if (Helpers.canViewAllGrades(servant)) {
        availableTabs.push({ key: 'grades_overview', label: 'نظرة عامة على الدرجات', icon: '📊' });
    }

    // الطلاب
    if (students.length > 0 || Helpers.canViewAllData(servant)) {
        availableTabs.push({ key: 'students', label: 'الطلاب', icon: '👥' });
    }

    // الافتقاد
    if (Helpers.canAddVisitationNotes(servant)) {
        availableTabs.push({ key: 'visitation', label: 'الافتقاد', icon: '🙏' });
    }

    // التقارير
    if (Helpers.canPrintReports(servant)) {
        availableTabs.push({ key: 'reports', label: 'التقارير', icon: '🖨️' });
    }

    // الحساب
    availableTabs.push({ key: 'account', label: 'حسابي', icon: '🔑' });

    const activeTab = State.getTab() || availableTabs[0]?.key || 'account';

    return `
        <div class="dashboard-header">
            <h2>${Helpers.icon('servant')} مرحباً، ${servant.name}</h2>
            <div class="info">
                <span>🏫 ${servant.classGroup}</span>
                <span>👥 ${students.length} دارس</span>
                ${subjects.length > 0 ? `<span>📚 ${subjects.length} مادة</span>` : ''}
                ${adminRoles.length > 0 ? `<span>⚙️ ${adminRoles.length} دور</span>` : ''}
            </div>
        </div>

        ${adminRoles.length > 0 ? `
            <div class="info-msg" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <strong>🎯 أدوارك:</strong>
                ${adminRoles.map(r => {
                    const role = Helpers.getServantAdminRoles().find(x => x.value === r);
                    return role ? `<span class="badge" style="background:${role.color};color:white;">${role.label}</span>` : '';
                }).join('')}
            </div>
        ` : ''}

        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="num">${students.length}</div>
                <div class="lbl">عدد الطلاب</div>
            </div>
            ${isSubjectTeacher ? `
                <div class="stat-card">
                    <div class="icon">📚</div>
                    <div class="num">${subjects.length}</div>
                    <div class="lbl">المواد</div>
                </div>
            ` : ''}
            <div class="stat-card">
                <div class="icon">📅</div>
                <div class="num">${AppData.settings.currentWeek || 1}</div>
                <div class="lbl">الأسبوع الحالي</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="num">${AppData.settings.totalWeeks || 15}</div>
                <div class="lbl">إجمالي الأسابيع</div>
            </div>
        </div>

        <div class="tabs" id="servantTabs">
            ${availableTabs.map(tab => `
                <button data-tab="${tab.key}" class="${activeTab === tab.key ? 'active' : ''}">
                    ${tab.icon} ${tab.label}
                </button>
            `).join('')}
        </div>

        <div class="tab-content">${renderServantTabContent(activeTab, servant, students)}</div>
    `;
}

function renderServantTabContent(tab, servant, students) {
    if (tab.startsWith('subject_')) {
        const subjectValue = tab.replace('subject_', '');
        return renderSubjectEvaluationTab(servant, students, subjectValue);
    }

    switch (tab) {
        case 'attendance': return renderServantAttendance(servant, students);
        case 'grades_overview': return renderGradesOverview(servant, students);
        case 'students': return renderServantStudents(servant, students);
        case 'visitation': return renderServantVisitation(servant, students);
        case 'reports': return renderClassReportsTab(servant, students);
        case 'account': return renderServantAccount(servant);
        default: return renderServantAccount(servant);
    }
}

function renderSubjectEvaluationTab(servant, students, subjectValue) {
    const subject = Helpers.getSubjects().find(s => s.value === subjectValue);
    if (!subject) return '<div class="empty-state">المادة غير موجودة</div>';

    const studentIds = new Set(students.map(s => s.id));
    const assignments = AppData.assignments.filter(a =>
        studentIds.has(a.studentId) && a.subject === subjectValue
    );

    const pending = assignments.filter(a => a.status === 'pending').length;
    const evaluated = assignments.filter(a => a.status === 'evaluated').length;

    // ✅ هل يمكنه التعديل؟
    const canEdit = Helpers.canEditGrades(servant, subjectValue);

    return `
        <div class="stats-grid">
            <div class="stat-card"><div class="icon">${subject.icon}</div><div class="num">${assignments.length}</div><div class="lbl">إجمالي الواجبات</div></div>
            <div class="stat-card"><div class="icon">⏳</div><div class="num">${pending}</div><div class="lbl">قيد الانتظار</div></div>
            <div class="stat-card"><div class="icon">✅</div><div class="num">${evaluated}</div><div class="lbl">تم التقييم</div></div>
        </div>

        ${!canEdit ? `
            <div class="info-msg">👁️ عرض فقط — لا يمكنك تعديل درجات هذه المادة</div>
        ` : ''}

        <div class="card">
            <div class="card-title"><span class="icon">${subject.icon}</span> تقييم واجبات ${subject.label} (${assignments.length})</div>
            <div class="gold-line"></div>
            ${assignments.length === 0 ? `
                <div class="empty-state"><span class="icon">📭</span>لا توجد واجبات في هذه المادة</div>
            ` : `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>الطالب</th>
                                <th>النوع</th>
                                <th>المحتوى</th>
                                <th>الحالة</th>
                                <th>الدرجة</th>
                                ${canEdit ? '<th>إجراء</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                            ${assignments.map(a => {
                                const student = AppData.students.find(s => s.id === a.studentId);
                                return `<tr>
                                    <td>${student ? student.name : a.studentId}</td>
                                    <td>${a.type === 'text' ? '📄' : a.type === 'image' ? '🖼️' : '🎤'}</td>
                                    <td>${(a.content || '').substring(0, 30)}${(a.content || '').length > 30 ? '...' : ''}</td>
                                    <td>${a.status === 'evaluated' ? Helpers.badge('تم', 'success') :
                                          a.status === 'pending' ? Helpers.badge('معلق', 'warning') :
                                          Helpers.badge('لم يتم', 'danger')}</td>
                                    <td>${a.score !== null ? a.score + '/10' : '—'}</td>
                                    ${canEdit ? `<td><button class="btn btn-gold btn-sm" onclick="openEvaluateModal('${a.id}')">تقييم</button></td>` : ''}
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `}
        </div>
    `;
}

function renderGradesOverview(servant, students) {
    const subjects = Helpers.getSubjects();
    const canEdit = Helpers.canEditGrades(servant);

    return `
        <div class="card">
            <div class="card-title"><span class="icon">📊</span> نظرة عامة على الدرجات</div>
            <div class="gold-line"></div>
            ${!canEdit ? `
                <div class="info-msg">👁️ عرض فقط لدرجات المواد التي لا تدرسها</div>
            ` : ''}
            ${students.length === 0 ? '<div class="empty-state">لا يوجد طلاب</div>' : `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>الطالب</th>
                                ${subjects.map(s => `<th>${s.icon} ${s.label}</th>`).join('')}
                                <th>المجموع</th>
                                <th>المتوسط</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map(s => {
                                const allScores = [];
                                const subjectCells = subjects.map(sub => {
                                    const assignments = AppData.assignments.filter(a =>
                                        a.studentId === s.id && a.subject === sub.value && a.status === 'evaluated'
                                    );
                                    if (assignments.length === 0) return '<td>—</td>';
                                    const avg = (assignments.reduce((sum, a) => sum + (a.score || 0), 0) / assignments.length).toFixed(1);
                                    allScores.push(...assignments.map(a => a.score || 0));
                                    return `<td>${avg}</td>`;
                                }).join('');
                                const total = allScores.reduce((sum, v) => sum + v, 0);
                                const avg = allScores.length > 0 ? (total / allScores.length).toFixed(1) : '—';
                                return `<tr>
                                    <td>${s.name}</td>
                                    ${subjectCells}
                                    <td><strong>${total}</strong></td>
                                    <td><strong>${avg}</strong></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `}
        </div>
    `;
}

                <div class="table-wrap">

                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                ${canAdd ? `<button class="btn btn-success mt-2" onclick="saveVisitation(${currentWeek})">💾 حفظ الافتقاد</button>` : ''}

}

function renderClassReportsTab(servant, students) {
    return `
        <div class="card">
            <div class="card-title"><span class="icon">🖨️</span> التقارير والطباعة</div>
            <div class="gold-line"></div>

async function handleLogin(role) {
    const errorEl = document.getElementById('loginError');
    if (errorEl) errorEl.style.display = 'none';

    try {
        showLoading('جارٍ التحقق...');
        if (role === 'student') {
            const code = (document.getElementById('studentCode').value || '').trim().toUpperCase();
            if (!code) { hideLoading(); showLoginError('أدخل الكود'); return; }
            const student = AppData.students.find(s => s.id === code);
            if (student) {
                State.setUser({ type: 'student', data: student });
                State.setPage('dashboard');
                showToast('✅ مرحباً');
            } else showLoginError('كود غير صحيح');
        } else if (role === 'servant') {
            const code = (document.getElementById('servantCode').value || '').trim().toUpperCase();
            const password = (document.getElementById('servantPassword').value || '').trim();
            if (!code || !password) { hideLoading(); showLoginError('أدخل البيانات'); return; }
            const servant = AppData.servants.find(s => s.code === code && s.password === password);
            if (servant) {
                State.setUser({ type: 'servant', data: servant });
                State.setPage('dashboard');
                showToast('✅ مرحباً');
            } else showLoginError('بيانات غير صحيحة');
        } else if (role === 'admin') {
            const username = (document.getElementById('adminUsername').value || '').trim();
            const password = (document.getElementById('adminPassword').value || '').trim();
            if (!username || !password) { hideLoading(); showLoginError('أدخل البيانات'); return; }
            let admins = await DB.getAdmins();
            if (admins.length === 0) {
                admins = [{ id: 'admin1', username: 'admin', password: 'admin123', name: 'أمين الخدمة العام' }];
                try { await setDoc(doc(db, COLLECTIONS.ADMINS, 'admin1'), admins[0]); } catch(e) {}
            }
            const admin = admins.find(a => a.username === username && a.password === password);
            if (admin) {
                State.setUser({ type: 'admin', data: admin });
                State.setPage('dashboard');
                showToast('✅ مرحباً');
            } else showLoginError('بيانات غير صحيحة');
        }
    } catch (e) {
        console.error(e);
        showLoginError('حدث خطأ');
    } finally { hideLoading(); }
}
function showLoginError(msg) {
    const el = document.getElementById('loginError');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}
function switchLoginTab(role) {
    const container = document.getElementById('loginFormContainer');
    document.querySelectorAll('#loginTabs button').forEach(t => t.classList.remove('active'));
    document.querySelector(`#loginTabs button[data-role="${role}"]`).classList.add('active');
    if (role === 'student') container.innerHTML = renderStudentLoginForm();
    else if (role === 'servant') container.innerHTML = renderServantLoginForm();
    else if (role === 'admin') container.innerHTML = renderAdminLoginForm();
    const err = document.getElementById('loginError');
    if (err) err.style.display = 'none';
}

async function saveBulkAttendance(week) {
    const checkboxes = document.querySelectorAll('.attendance-check');
    const records = [];
    checkboxes.forEach(cb => {
        records.push({
            studentId: cb.dataset.student,
            week, status: cb.checked ? 'present' : 'absent',
            type: 'attendance'
        });
    });
    try {
        showLoading('جارٍ الحفظ...');
        await DB.saveAttendanceBulk(records);
        records.forEach(r => {
            const idx = AppData.attendance.findIndex(a =>
                a.studentId === r.studentId && a.week === r.week && a.type === 'attendance');
            if (idx !== -1) AppData.attendance[idx] = { ...AppData.attendance[idx], ...r };
            else AppData.attendance.push(r);
        });
        showToast('✅ تم الحفظ');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

async function saveVisitation(week) {
    const checkboxes = document.querySelectorAll('.visitation-check');
    try {
        showLoading('جارٍ الحفظ...');
        for (const cb of checkboxes) {
            const studentId = cb.dataset.student;
            if (cb.checked) {
                await DB.saveAttendance({ studentId, week, status: 'present', type: 'visitation' });
                const idx = AppData.attendance.findIndex(a =>
                    a.studentId === studentId && a.week === week && a.type === 'visitation');
                if (idx !== -1) AppData.attendance[idx].status = 'present';
                else AppData.attendance.push({ studentId, week, status: 'present', type: 'visitation' });
            } else {
                const docId = `${studentId}_W${week}_visitation`;
                try { await deleteDoc(doc(db, COLLECTIONS.ATTENDANCE, docId)); } catch(e) {}
                const idx = AppData.attendance.findIndex(a =>
                    a.studentId === studentId && a.week === week && a.type === 'visitation');
                if (idx !== -1) AppData.attendance.splice(idx, 1);
            }
        }
        showToast('✅ تم الحفظ');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

async function adminSetAttendance(studentId, week, status) {
    try {
        await DB.saveAttendance({ studentId, week, status, type: 'attendance' });
        const idx = AppData.attendance.findIndex(a =>
            a.studentId === studentId && a.week === week && a.type === 'attendance');

        else AppData.attendance.push({ studentId, week, status, type: 'attendance' });
    } catch (e) { showToast('❌ فشل', 'error'); }
}

async function changeServantPassword(servantId) {
    const current = document.getElementById('currentPassword').value.trim();
    const newPass = document.getElementById('newPassword').value.trim();
    const confirmPass = document.getElementById('confirmPassword').value.trim();
    const servant = AppData.servants.find(s => s.id === servantId);
    if (!servant) return;

    if (current !== servant.password) { showToast('❌ كلمة المرور الحالية غير صحيحة', 'error'); return; }
    if (!newPass || newPass.length < 4) { showToast('⚠️ 4 أحرف على الأقل', 'error'); return; }
    if (newPass !== confirmPass) { showToast('⚠️ غير متطابقتين', 'error'); return; }

    try {
        showLoading('جارٍ الحفظ...');
        await DB.updateServant(servantId, { password: newPass });
        servant.password = newPass;
        if (State.currentUser && State.currentUser.type === 'servant') {
            State.currentUser.data.password = newPass;
            DB.setSession(State.currentUser);
        }
        showToast('✅ تم التغيير');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

function toggleAssignFileInput() {
    const type = document.getElementById('assignType').value;
    const group = document.getElementById('assignFileGroup');
    const input = document.getElementById('assignFile');
    if (type === 'text') { group.style.display = 'none'; input.value = ''; }
    else {
        group.style.display = 'block';
        input.accept = type === 'image' ? 'image/*' : 'audio/*';
    }
}

async function saveAssignment(studentId) {
    const subject = document.getElementById('assignSubject').value;
    const type = document.getElementById('assignType').value;
    const content = document.getElementById('assignContent').value.trim();
    const file = document.getElementById('assignFile').files[0];

    if (!subject) { showToast('اختر المادة', 'error'); return; }
    if (!content && !file && type === 'text') { showToast('اكتب المحتوى', 'error'); return; }
    if ((type === 'image' || type === 'audio') && !file) { showToast('اختر ملف', 'error'); return; }

    try {
        let fileUrl = '';
        if (file) {
            document.getElementById('uploadProgress').classList.remove('hidden');
            const ext = file.name.split('.').pop();
            const path = StorageManager.assignmentPath(studentId, ext);
            const result = await StorageManager.uploadFile(file, path, (progress) => {
                document.getElementById('uploadFill').style.width = progress + '%';
                document.getElementById('uploadStatus').textContent = `رفع... ${Math.round(progress)}%`;
            });
            fileUrl = result.url;
        }

        showLoading('جارٍ الحفظ...');
        const saved = await DB.addAssignment({
            studentId, subject, type,
            content: content || '',
            status: 'pending', score: null, notes: '',
            fileUrl
        });
        AppData.assignments.push(saved);
        closeModal();
        showToast('✅ تم الإرسال');
        renderApp();
    } catch (e) {
        console.error(e);
        showToast('❌ فشل', 'error');
    } finally { hideLoading(); }
}

async function saveEvaluation(assignmentId) {
    const score = parseInt(document.getElementById('evalScore').value);
    const notes = document.getElementById('evalNotes').value;
    if (isNaN(score) || score < 0 || score > 10) { showToast('0-10', 'error'); return; }
    try {
        showLoading('جارٍ الحفظ...');
        await DB.updateAssignment(assignmentId, { score, notes, status: 'evaluated' });
        const idx = AppData.assignments.findIndex(a => a.id === assignmentId);
        if (idx !== -1) Object.assign(AppData.assignments[idx], { score, notes, status: 'evaluated' });
        closeModal();
        showToast('✅ تم');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

async function saveNewStudent() {
    const name = document.getElementById('addStudentName').value.trim();
    const phone1 = document.getElementById('addStudentPhone1').value.trim();
    if (!name) { showToast('أدخل الاسم', 'error'); return; }
    if (!phone1) { showToast('أدخل الهاتف', 'error'); return; }

    try {
        showLoading('جارٍ التوليد...');
        const code = await DB.generateStudentCode();

        let personalPhotoUrl = '', formPhotoUrl = '';
        const photoFile = document.getElementById('addStudentPhoto').files[0];
        const formFile = document.getElementById('addStudentFormPhoto').files[0];

        if (photoFile || formFile) {
            document.getElementById('studentUploadProgress').classList.remove('hidden');
            if (photoFile) {
                const ext = photoFile.name.split('.').pop();
                const path = StorageManager.studentPhotoPath(code, ext);
                const res = await StorageManager.uploadFile(photoFile, path, (p) => {
                    document.getElementById('studentUploadFill').style.width = p + '%';
                });
                personalPhotoUrl = res.url;
            }
            if (formFile) {
                const ext = formFile.name.split('.').pop();
                const path = StorageManager.studentFormPath(code, ext);
                const res = await StorageManager.uploadFile(formFile, path, (p) => {
                    document.getElementById('studentUploadFill').style.width = p + '%';
                });
                formPhotoUrl = res.url;
            }
        }

        showLoading('جارٍ الحفظ...');
        const student = {
            id: code, name, type: 'جديد',
            gender: document.getElementById('addStudentGender').value,
            birthdate: document.getElementById('addStudentBirth').value,
            stage: document.getElementById('addStudentStage').value,
            class: document.getElementById('addStudentClass').value,
            classGroup: document.getElementById('addStudentClassGroup').value,
            phone1,
            phone2: document.getElementById('addStudentPhone2').value.trim(),
            address: document.getElementById('addStudentAddress').value.trim(),
            deaconRank: document.getElementById('addStudentDeacon').value,
            formReceived: document.getElementById('addStudentForm').checked,
            formPaid: document.getElementById('addStudentPaid').checked,
            personalPhotoUrl, formPhotoUrl
        };
        await DB.addStudent(student);
        AppData.students.push(student);
        closeModal();
        showToast(`✅ الكود: ${code}`);
        renderApp();
    } catch (e) {
        console.error(e);
        showToast('❌ فشل', 'error');
    } finally { hideLoading(); }
}

async function updateStudentData(id) {
    const updates = {
        name: document.getElementById('editStudentName').value.trim(),
        stage: document.getElementById('editStudentStage').value,
        class: document.getElementById('editStudentClass').value,
        classGroup: document.getElementById('editStudentClassGroup').value,
        deaconRank: document.getElementById('editStudentDeacon').value,
        phone1: document.getElementById('editStudentPhone1').value.trim(),
        phone2: document.getElementById('editStudentPhone2').value.trim(),
        address: document.getElementById('editStudentAddress').value.trim(),
        formReceived: document.getElementById('editStudentForm').checked,
        formPaid: document.getElementById('editStudentPaid').checked
    };
    if (!updates.name) { showToast('أدخل الاسم', 'error'); return; }
    try {
        showLoading('جارٍ الحفظ...');
        await DB.updateStudent(id, updates);
        const idx = AppData.students.findIndex(s => s.id === id);
        if (idx !== -1) Object.assign(AppData.students[idx], updates);
        closeModal();
        showToast('✅ تم');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

async function saveNewServant() {
    const name = document.getElementById('addServantName').value.trim();
    const code = document.getElementById('addServantCode').value.trim().toUpperCase();
    const phone = document.getElementById('addServantPhone').value.trim();
    const password = document.getElementById('addServantPassword').value.trim();
    const classGroup = document.getElementById('addServantClassGroup').value;

    if (!name) { showToast('أدخل الاسم', 'error'); return; }
    if (!phone) { showToast('أدخل الهاتف', 'error'); return; }
    if (!password) { showToast('أدخل كلمة المرور', 'error'); return; }
    if (!classGroup) { showToast('اختر الفصل', 'error'); return; }

    const subjects = [];
    document.querySelectorAll('.add-servant-subject:checked').forEach(cb => subjects.push(cb.value));

    const adminRoles = [];
    document.querySelectorAll('.add-servant-admin-role:checked').forEach(cb => adminRoles.push(cb.value));

    if (subjects.length === 0 && adminRoles.length === 0) {
        showToast('⚠️ اختر مادة أو دور إداري', 'error');
        return;
    }

    const exists = AppData.servants.find(s => s.code === code);
    if (exists) {
        showToast('⚠️ الكود مستخدم', 'error');
        document.getElementById('addServantCode').value = Helpers.generateServantCode();
        return;
    }

    const servant = {
        id: 'SRV' + Date.now(),
        name, code, phone, password, classGroup,
        subjectSpecialty: subjects,
        adminRole: adminRoles,
        role: subjects.length > 0 ? `subject_${subjects[0]}` : adminRoles[0] || 'assistant'
    };

    try {
        showLoading('جارٍ الحفظ...');
        await DB.addServant(servant);
        AppData.servants.push(servant);
        closeModal();
        showToast(`✅ الكود: ${code}`);
        renderApp();
    } catch (e) {
        console.error(e);
        showToast('❌ فشل', 'error');
    } finally { hideLoading(); }
}

function openEditServantModal(id) {
    const s = AppData.servants.find(x => x.id === id);
    if (!s) return;

    const subjects = Array.isArray(s.subjectSpecialty) ? s.subjectSpecialty :
                     (s.subjectSpecialty ? [s.subjectSpecialty] : []);
    const adminRoles = Array.isArray(s.adminRole) ? s.adminRole :
                       (s.adminRole ? [s.adminRole] : []);

    showModal(`
        <h3>✏️ تعديل بيانات الخادم</h3>

        <div class="form-group"><label>الاسم</label><input type="text" id="editServantName" value="${s.name}"></div>

        <div class="grid-2">
            <div class="form-group"><label>الكود</label><input type="text" id="editServantCode" value="${s.code}"></div>
            <div class="form-group"><label>الهاتف</label><input type="tel" id="editServantPhone" value="${s.phone || ''}"></div>
        </div>

        <div class="form-group">
            <label>🔑 كلمة المرور</label>
            <div class="flex gap-1">
                <input type="text" id="editServantPassword" value="${s.password}" style="flex:1;font-weight:bold;color:var(--wine);">
                <button class="btn btn-gold btn-sm" onclick="regeneratePassword()">🔄</button>
            </div>
        </div>

        <div class="form-group">
            <label>🏫 الفصل</label>
            <select id="editServantClassGroup">
                <option value="الكل" ${s.classGroup === 'الكل' ? 'selected' : ''}>الكل</option>
                ${Helpers.getClassGroups().map(g => `<option value="${g}" ${g === s.classGroup ? 'selected' : ''}>${g}</option>`).join('')}
            </select>
        </div>

        <div class="form-group">
            <label>📚 مواد التخصص</label>
            <div style="padding:12px;border:2px solid var(--gray-light);border-radius:var(--radius-sm);background:#fcfaf7;">
                ${Helpers.getSubjects().map(sub => `
                    <label style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                        <input type="checkbox" class="edit-servant-subject" value="${sub.value}"
                            ${subjects.includes(sub.value) ? 'checked' : ''}
                            style="width:18px;height:18px;accent-color:var(--wine);">
                        <span>${sub.icon} <strong>${sub.label}</strong></span>
                    </label>
                `).join('')}
            </div>
        </div>

        <div class="form-group">
            <label>⚙️ الأدوار الإدارية</label>
            <div style="padding:12px;border:2px solid var(--gray-light);border-radius:var(--radius-sm);background:#fcfaf7;max-height:450px;overflow-y:auto;">
                ${Helpers.getServantAdminRoles().map(r => `
                    <label class="role-option" style="border-right-color:${r.color};">
                        <input type="checkbox" class="edit-servant-admin-role" value="${r.value}"
                            ${adminRoles.includes(r.value) ? 'checked' : ''}>
                        <div>
                            <div class="role-title" style="color:${r.color};">${r.label}</div>
                            <div class="role-desc">${r.description}</div>
                        </div>
                    </label>
                `).join('')}
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn btn-gold" onclick="updateServantData('${s.id}')">💾 حفظ</button>
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
        </div>
    `);
}

function regeneratePassword() {
    const newPass = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('editServantPassword').value = newPass;
    showToast(`🔑 كلمة المرور: ${newPass}`);
}

async function updateServantData(id) {
    const subjects = [];
    document.querySelectorAll('.edit-servant-subject:checked').forEach(cb => subjects.push(cb.value));

    const adminRoles = [];
    document.querySelectorAll('.edit-servant-admin-role:checked').forEach(cb => adminRoles.push(cb.value));

    if (subjects.length === 0 && adminRoles.length === 0) {
        showToast('⚠️ اختر مادة أو دور إداري', 'error');
        return;
    }

    const updates = {
        name: document.getElementById('editServantName').value.trim(),
        code: document.getElementById('editServantCode').value.trim().toUpperCase(),
        phone: document.getElementById('editServantPhone').value.trim(),
        password: document.getElementById('editServantPassword').value.trim(),
        classGroup: document.getElementById('editServantClassGroup').value,
        subjectSpecialty: subjects,
        adminRole: adminRoles,
        role: subjects.length > 0 ? `subject_${subjects[0]}` : adminRoles[0] || 'assistant'
    };

    if (!updates.name) { showToast('أدخل الاسم', 'error'); return; }
    if (!updates.phone) { showToast('أدخل الهاتف', 'error'); return; }
    if (!updates.password) { showToast('أدخل كلمة المرور', 'error'); return; }

    try {
        showLoading('جارٍ الحفظ...');
        await DB.updateServant(id, updates);
        const idx = AppData.servants.findIndex(s => s.id === id);
        if (idx !== -1) Object.assign(AppData.servants[idx], updates);
        closeModal();
        showToast('✅ تم');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

async function deleteServantConfirm(id) {
    if (!confirm('حذف الخادم؟')) return;
    try {
        await DB.deleteServant(id);
        AppData.servants = AppData.servants.filter(s => s.id !== id);
        showToast('🗑️ تم');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
}

async function saveSettings() {
    const settings = {
        termStart: document.getElementById('settingsStart').value,
        termEnd: document.getElementById('settingsEnd').value,
        totalWeeks: parseInt(document.getElementById('settingsWeeks').value) || 15,
        currentWeek: parseInt(document.getElementById('settingsCurrentWeek').value) || 1
    };
    try {
        showLoading('جارٍ الحفظ...');
        await DB.setSettings(settings);
        AppData.settings = settings;
        showToast('✅ تم');
        renderApp();
    } catch (e) { showToast('❌ فشل', 'error'); }
    finally { hideLoading(); }
}

// ============================================================
// 14. Main Render
// ============================================================
function renderApp() {
    const app = document.getElementById('appContainer');
    const navLogin = document.getElementById('navLoginBtn');
    const navDash = document.getElementById('navDashBtn');
    const navLogout = document.getElementById('navLogoutBtn');
    const user = State.currentUser;

    if (user) {
        navLogin.classList.add('hidden');
        navDash.classList.remove('hidden');
        navLogout.classList.remove('hidden');
        if (user.type === 'student') navDash.textContent = '👨‍🎓 لوحتي';
        else if (user.type === 'servant') {
            const roles = Helpers.getServantAdminRoles(user.data);
            if (Helpers.isSuperAdmin(user.data)) navDash.textContent = '👑 لوحة المسؤول';
            else if (Helpers.isMainControl(user.data)) navDash.textContent = '🎛️ لوحة الكنترول';
            else if (Helpers.isAdminControl(user.data)) navDash.textContent = '⚙️ لوحة الإداري';
            else if (Helpers.isClassSupervisor(user.data)) navDash.textContent = '👨‍🏫 مسؤول فصل';
            else if (Helpers.isSubjectTeacherRole(user.data)) navDash.textContent = '📚 مسؤول مادة';
            else navDash.textContent = '👨‍🏫 لوحة الخادم';
        } else navDash.textContent = '👨‍💼 لوحة التحكم';
    } else {
        navLogin.classList.remove('hidden');
        navDash.classList.add('hidden');
        navLogout.classList.add('hidden');
    }

    document.querySelectorAll('#mainNav button[data-page]').forEach(b => b.classList.remove('active'));
    const activeNav = document.querySelector(`#mainNav button[data-page="${State.currentPage}"]`);
    if (activeNav) activeNav.classList.add('active');

    switch (State.currentPage) {
        case 'home': app.innerHTML = renderHome(); break;
        case 'login':
            app.innerHTML = renderLogin();
            document.querySelectorAll('#loginTabs button').forEach(btn => {
                btn.addEventListener('click', function() { switchLoginTab(this.dataset.role); });
            });
            break;
        case 'dashboard':
            if (!user) { State.setPage('login'); return; }
            if (user.type === 'student') {
                app.innerHTML = renderStudentDashboard();
                document.querySelectorAll('#studentTabs button').forEach(btn => {
                    btn.addEventListener('click', function() { State.setTab(this.dataset.tab); });
                });
            } else if (user.type === 'servant') {
                app.innerHTML = renderServantDashboard();
                document.querySelectorAll('#servantTabs button').forEach(btn => {
                    btn.addEventListener('click', function() { State.setTab(this.dataset.tab); });
                });
            } else if (user.type === 'admin') {
                app.innerHTML = renderAdminDashboard();
                document.querySelectorAll('#adminTabs button').forEach(btn => {
                    btn.addEventListener('click', function() { State.setTab(this.dataset.tab); });
                });
            }
            break;
        default: app.innerHTML = renderHome();
    }

    document.querySelectorAll('#mainNav button[data-page]').forEach(btn => {
        btn.addEventListener('click', function() { State.setPage(this.dataset.page); });
    });

    setTimeout(() => NotificationManager.updateBell(), 100);
}

// 15. Init
// ============================================================
async function init() {
    ConnectionState.init();
    await AuthManager.init();

    const session = DB.getSession();
    if (session) State.currentUser = session;

    document.getElementById('navLogoutBtn').addEventListener('click', () => State.logout());
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener('click', (e) => {
        const panel = document.getElementById('notificationPanel');
        const bell = document.getElementById('notificationBell');
        if (panel && bell && !panel.contains(e.target) && !bell.contains(e.target)) {
            panel.classList.remove('show');
        }
    });

    await AppData.loadAll();
    NotificationManager.init();
    renderApp();
    showToast('✅ تم الاتصال');
}

document.addEventListener('DOMContentLoaded', init);
